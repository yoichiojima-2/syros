name: Release

# Tag-driven release: push a tag like v0.2.0 (or run manually) to
#   1. run lint + tests,
#   2. build the runner image and push it to Artifact Registry,
#   3. roll the Cloud Run job and console service to the new digest,
#   4. publish a GitHub Release with auto-generated notes.
#
# GCP auth uses keyless Workload Identity Federation. Configure two repo
# secrets (see docs/release.md for the one-time GCP setup):
#   GCP_WORKLOAD_IDENTITY_PROVIDER  projects/<num>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#   GCP_SERVICE_ACCOUNT             <deployer-sa>@<project>.iam.gserviceaccount.com
# If the secrets are absent the deploy job is skipped, so tagging still
# produces a GitHub Release without touching GCP.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGION: asia-northeast1
  IMAGE: asia-northeast1-docker.pkg.dev/syros-505320/syros/runner
  JOB: syros-runner
  SERVICE: syros-console

permissions:
  contents: read

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: pytest
        run: uv run pytest tests/ -q

  gcp-secrets:
    name: Check GCP secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        name: Probe repo secrets
        env:
          WIP: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$WIP" ] && [ -n "$SA" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GCP secrets not set; skipping build & deploy."
          fi

  deploy:
    name: Build and deploy
    needs: [checks, gcp-secrets]
    if: needs.gcp-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          TAG="${GITHUB_REF_NAME}"
          docker build --platform linux/amd64 -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
          echo "DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$TAG")" >> "$GITHUB_ENV"

      # Deploy by digest: Cloud Run resolves tags at deploy time, not per
      # execution, so pinning the digest is what actually rolls the release.
      - name: Roll Cloud Run job and console service
        run: |
          gcloud run jobs update "$JOB" --image "$DIGEST" --region "$REGION"
          gcloud run services update "$SERVICE" --image "$DIGEST" --region "$REGION"

  github-release:
    name: Publish GitHub Release
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
