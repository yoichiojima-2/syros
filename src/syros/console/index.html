<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>syros</title>
<style>
  :root {
    --bg: #10141c;
    --panel: #161b25;
    --raised: #1d2330;
    --line: #29303f;
    --text: #dee3ec;
    --dim: #7f8899;
    --amber: #e8a33d;
    --green: #43c98a;
    --blue: #58a6e8;
    --red: #e0655a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.55;
    display: flex;
    flex-direction: column;
  }
  button {
    font: inherit;
    color: inherit;
    background: var(--raised);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 12px;
    cursor: pointer;
  }
  button:hover { border-color: var(--dim); }
  button:focus-visible, [tabindex]:focus-visible, textarea:focus-visible, input:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 1px;
  }
  .eyebrow {
    font: 600 10px/1 var(--mono);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
  }

  /* --- header --- */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header .wordmark { font: 600 15px var(--mono); letter-spacing: 0.02em; }
  header .project { font: 12px var(--mono); color: var(--dim); }
  header .spacer { flex: 1; }
  #conn { display: flex; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--dim); }
  #conn .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); }
  #conn.offline .dot { background: var(--red); }

  /* --- layout --- */
  main { flex: 1; display: grid; grid-template-columns: 264px 1fr; min-height: 0; }

  /* --- sidebar --- */
  #sidebar {
    border-right: 1px solid var(--line);
    background: var(--panel);
    overflow-y: auto;
    padding: 12px 10px;
  }
  #sidebar .eyebrow { padding: 0 6px 8px; display: block; }
  .session {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: 1px solid transparent;
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 2px;
    font-family: var(--mono);
  }
  .session:hover { background: var(--raised); border-color: transparent; }
  .session.active { background: var(--raised); border-color: var(--line); }
  .session .row1 { display: flex; align-items: center; gap: 8px; font-size: 12px; }
  .session .row2 { display: flex; gap: 10px; font-size: 11px; color: var(--dim); margin-top: 2px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .st-running { background: var(--green); }
  .st-stalled { background: var(--amber); }
  .st-queued { background: var(--blue); }
  .st-idle { background: var(--dim); }
  .st-terminated { background: var(--red); }
  @media (prefers-reduced-motion: no-preference) {
    .st-running { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }
  }
  .empty { color: var(--dim); font-size: 13px; padding: 8px; }

  /* --- session pane --- */
  #pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  #pane-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--line);
  }
  #pane-head .sid { font: 600 13px var(--mono); }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: 11px var(--mono);
    color: var(--dim);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 2px 10px;
  }
  #pane-head .meta { font: 11px var(--mono); color: var(--dim); }
  #pane-head .spacer { flex: 1; }
  #btn-kill:hover { border-color: var(--red); color: var(--red); }

  /* --- transcript --- */
  #transcript { flex: 1; overflow-y: auto; padding: 20px; }
  #transcript > * { max-width: 860px; margin: 0 auto 12px; }
  .m-user {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--blue);
    padding: 8px 12px;
    background: var(--panel);
    border-radius: 8px;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .m-user::before { content: "\276F  "; color: var(--dim); }
  .m-text { white-space: pre-wrap; overflow-wrap: break-word; }
  .m-thinking { font-size: 13px; color: var(--dim); }
  .m-thinking summary { cursor: pointer; font: 11px var(--mono); }
  .m-thinking div { white-space: pre-wrap; font-style: italic; padding: 6px 0 0 12px; }
  .m-tool, .m-result { font: 12px var(--mono); }
  .m-tool summary, .m-result summary {
    cursor: pointer;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .m-tool summary b { color: var(--text); font-weight: 600; }
  .m-result.error summary { color: var(--red); }
  .m-tool pre, .m-result pre {
    margin: 6px 0 0;
    padding: 10px 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow-x: auto;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  .m-system { font: 11px var(--mono); color: var(--dim); }
  .m-final {
    font: 12px var(--mono);
    color: var(--dim);
    border-top: 1px solid var(--line);
    padding-top: 8px;
  }
  .m-final.error { color: var(--red); }

  /* --- approvals: the one loud thing --- */
  #approvals { max-width: 900px; margin: 0 auto; width: 100%; padding: 0 20px; }
  .approval {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--amber);
    border-radius: 10px;
    background: var(--panel);
    padding: 12px 14px 14px;
    margin-bottom: 10px;
  }
  .approval .timebar {
    position: absolute;
    top: 0; left: 0;
    height: 3px;
    background: var(--amber);
    transition: width 0.5s linear;
  }
  .approval.urgent .timebar { background: var(--red); }
  .approval .head { display: flex; align-items: baseline; gap: 10px; }
  .approval .head b { font: 600 13px var(--mono); color: var(--amber); }
  .approval.urgent .head b { color: var(--red); }
  .approval .count { font: 12px var(--mono); color: var(--dim); margin-left: auto; }
  .approval.urgent .count { color: var(--red); }
  .approval pre {
    font: 12px var(--mono);
    color: var(--dim);
    white-space: pre-wrap;
    overflow-wrap: break-word;
    max-height: 160px;
    overflow-y: auto;
    margin: 8px 0 10px;
  }
  .approval .actions { display: flex; gap: 8px; }
  .approval input {
    flex: 1;
    font: 12px var(--mono);
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 10px;
  }
  .btn-allow { border-color: var(--green); color: var(--green); }
  .btn-deny:hover { border-color: var(--red); color: var(--red); }

  /* --- composer --- */
  #composer {
    display: flex;
    gap: 8px;
    max-width: 900px;
    margin: 0 auto;
    width: 100%;
    padding: 12px 20px 16px;
  }
  #composer textarea {
    flex: 1;
    font: 13px var(--mono);
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 12px;
    resize: none;
    height: 42px;
  }
  #composer textarea:disabled { opacity: 0.4; }
  #flash { font: 11px var(--mono); color: var(--dim); text-align: center; padding-bottom: 6px; }

  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    #sidebar { max-height: 30vh; border-right: none; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <span class="wordmark">syros</span>
  <span class="project" id="project"></span>
  <span class="spacer"></span>
  <span id="conn"><span class="dot"></span><span id="conn-label">connected</span></span>
</header>
<main>
  <nav id="sidebar">
    <span class="eyebrow">Sessions</span>
    <div id="session-list"><div class="empty">loading…</div></div>
  </nav>
  <section id="pane">
    <div id="pane-head" hidden>
      <span class="sid" id="head-sid"></span>
      <span class="pill"><span class="dot" id="head-dot"></span><span id="head-state"></span></span>
      <span class="meta" id="head-meta"></span>
      <span class="spacer"></span>
      <button id="btn-interrupt">Interrupt</button>
      <button id="btn-kill">Kill</button>
    </div>
    <div id="transcript"><div class="empty">Select a session — or run a query with sandbox="gcp" and it will appear on the left.</div></div>
    <div id="approvals"></div>
    <div id="flash"></div>
    <form id="composer" hidden>
      <textarea id="prompt" placeholder="Send a prompt — Enter to send, Shift+Enter for a new line"></textarea>
      <button type="submit" id="btn-send">Send</button>
    </form>
  </section>
</main>
<script>
"use strict";

const state = {
  sid: null,
  cursor: 0,
  session: null,
  approvals: [],
  clockOffset: 0,   // serverNow - localNow
  pinned: true,
  online: true,
};

const $ = (id) => document.getElementById(id);

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function serverNow() {
  return Date.now() / 1000 + state.clockOffset;
}

async function api(path, options) {
  let response;
  try {
    response = await fetch(path, options);
  } catch (err) {
    setOnline(false);
    throw err;
  }
  setOnline(true);
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.status);
  if (data.now) state.clockOffset = data.now - Date.now() / 1000;
  return data;
}

function setOnline(ok) {
  state.online = ok;
  $("conn").classList.toggle("offline", !ok);
  $("conn-label").textContent = ok ? "connected" : "offline";
}

function flash(text) {
  $("flash").textContent = text;
  if (text) setTimeout(() => { if ($("flash").textContent === text) flash(""); }, 4000);
}

// --- session list ---

function relTime(epoch) {
  if (!epoch) return "";
  const s = Math.max(0, serverNow() - epoch);
  if (s < 60) return `${Math.floor(s)}s ago`;
  if (s < 3600) return `${Math.floor(s / 60)}m ago`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
  return `${Math.floor(s / 86400)}d ago`;
}

function shortId(sid) {
  return sid.length > 16 ? sid.slice(0, 13) + "…" : sid;
}

async function refreshSessions() {
  const data = await api("/api/sessions");
  const list = $("session-list");
  list.replaceChildren();
  if (!data.sessions.length) {
    list.append(el("div", "empty", "No sessions yet."));
    return;
  }
  for (const s of data.sessions) {
    const item = el("button", "session" + (s.id === state.sid ? " active" : ""));
    item.type = "button";
    item.title = s.id;
    const row1 = el("div", "row1");
    row1.append(el("span", "dot st-" + s.state), el("span", null, shortId(s.id)));
    const row2 = el("div", "row2");
    row2.append(
      el("span", null, `$${(s.cost_usd || 0).toFixed(4)}`),
      el("span", null, relTime(s.updated_at || s.created_at)),
    );
    item.append(row1, row2);
    item.addEventListener("click", () => selectSession(s.id));
    list.append(item);
  }
}

// --- transcript rendering ---

function blockList(content) {
  return Array.isArray(content) ? content : [];
}

function compact(value, max) {
  let text = typeof value === "string" ? value : JSON.stringify(value);
  if (text == null) text = "";
  return text.length > max ? text.slice(0, max) + "…" : text;
}

function toolRow(className, summaryParts, detail) {
  const details = el("details", className);
  const summary = el("summary");
  summary.append(...summaryParts);
  details.append(summary);
  const pre = el("pre", null, detail);
  details.append(pre);
  return details;
}

function renderMessage(message) {
  const out = [];
  if (message.kind === "user") {
    if (typeof message.content === "string") {
      out.push(el("div", "m-user", message.content));
    }
    for (const block of blockList(message.content)) {
      if (block.type === "text") out.push(el("div", "m-user", block.text));
      if (block.type === "tool_result") {
        const row = toolRow(
          "m-result" + (block.is_error ? " error" : ""),
          [`↳ ${compact(block.content, 160)}`],
          typeof block.content === "string" ? block.content : JSON.stringify(block.content, null, 2),
        );
        out.push(row);
      }
    }
  } else if (message.kind === "assistant") {
    for (const block of blockList(message.content)) {
      if (block.type === "text") out.push(el("div", "m-text", block.text));
      if (block.type === "thinking") {
        const details = el("details", "m-thinking");
        details.append(el("summary", null, "thinking"), el("div", null, block.thinking || ""));
        out.push(details);
      }
      if (block.type === "tool_use" || block.type === "server_tool_use") {
        const name = el("b", null, block.name || "?");
        out.push(toolRow(
          "m-tool",
          ["⚙ ", name, ` ${compact(block.input || {}, 140)}`],
          JSON.stringify(block.input || {}, null, 2),
        ));
      }
    }
  } else if (message.kind === "system") {
    out.push(el("div", "m-system", `system: ${message.subtype || ""}`));
  } else if (message.kind === "result") {
    const cost = message.total_cost_usd != null ? ` · $${message.total_cost_usd.toFixed(4)}` : "";
    const secs = message.duration_ms != null ? ` · ${(message.duration_ms / 1000).toFixed(1)}s` : "";
    out.push(el(
      "div",
      "m-final" + (message.is_error ? " error" : ""),
      `[${message.subtype}] ${message.num_turns} turns${cost}${secs}`,
    ));
  }
  return out;
}

function appendEvents(events) {
  const box = $("transcript");
  for (const event of events) {
    state.cursor = event.seq;
    for (const node of renderMessage(event.message || {})) box.append(node);
  }
  if (events.length && state.pinned) box.scrollTop = box.scrollHeight;
}

$("transcript").addEventListener("scroll", () => {
  const box = $("transcript");
  state.pinned = box.scrollTop + box.clientHeight >= box.scrollHeight - 48;
});

// --- approvals ---

function renderApprovals() {
  const box = $("approvals");
  box.replaceChildren();
  for (const approval of state.approvals) {
    const card = el("div", "approval");
    card.dataset.deadline = approval.deadline;
    card.dataset.requested = approval.requested_at;
    card.append(el("div", "timebar"));
    const head = el("div", "head");
    head.append(el("b", null, approval.tool_name), el("span", "eyebrow", "approval"),
                el("span", "count"));
    card.append(head);
    card.append(el("pre", null, JSON.stringify(approval.input, null, 2)));
    const actions = el("div", "actions");
    const reason = el("input");
    reason.placeholder = "deny reason (optional)";
    const allow = el("button", "btn-allow", "Allow");
    allow.type = "button";
    allow.addEventListener("click", () => decide(approval.call_hash, true, null));
    const deny = el("button", "btn-deny", "Deny");
    deny.type = "button";
    deny.addEventListener("click", () => decide(approval.call_hash, false, reason.value || null));
    actions.append(allow, deny, reason);
    card.append(actions);
    box.append(card);
  }
  tickCountdowns();
}

function tickCountdowns() {
  for (const card of document.querySelectorAll(".approval")) {
    const deadline = Number(card.dataset.deadline);
    const total = Math.max(1, deadline - Number(card.dataset.requested));
    const left = Math.max(0, deadline - serverNow());
    card.classList.toggle("urgent", left < 60);
    card.querySelector(".timebar").style.width = `${(left / total) * 100}%`;
    const m = Math.floor(left / 60);
    const s = Math.floor(left % 60).toString().padStart(2, "0");
    card.querySelector(".count").textContent = left > 0 ? `${m}:${s} left` : "expired";
  }
}

async function decide(callHash, allow, message) {
  try {
    await api(`/api/sessions/${state.sid}/approvals/${callHash}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ allow, message }),
    });
    state.approvals = state.approvals.filter((a) => a.call_hash !== callHash);
    renderApprovals();
    flash(allow ? "allowed" : "denied");
  } catch (err) {
    flash(`error: ${err.message}`);
  }
}

// --- focused session ---

function sameApprovals(next) {
  const prev = state.approvals.map((a) => a.call_hash).join(",");
  return prev === next.map((a) => a.call_hash).join(",");
}

function renderHead() {
  const s = state.session;
  $("pane-head").hidden = false;
  $("composer").hidden = false;
  $("head-sid").textContent = s.id;
  $("head-dot").className = "dot st-" + s.state;
  $("head-state").textContent = s.state;
  $("head-meta").textContent =
    `${s.model || ""}  $${(s.cost_usd || 0).toFixed(4)}` +
    (s.stop_reason ? `  · ${s.stop_reason}` : "");
  const dead = s.state === "terminated";
  $("prompt").disabled = dead;
  $("btn-send").disabled = dead;
  $("btn-interrupt").disabled = dead;
  $("btn-kill").disabled = dead;
}

async function pollSession() {
  if (!state.sid) return;
  const sid = state.sid;
  const data = await api(`/api/sessions/${sid}/poll?after=${state.cursor}`);
  if (state.sid !== sid) return;  // switched away mid-flight
  state.session = data.session;
  renderHead();
  appendEvents(data.events);
  if (!sameApprovals(data.approvals)) {
    state.approvals = data.approvals;
    renderApprovals();
  }
}

function selectSession(sid) {
  location.hash = sid;
  state.sid = sid;
  state.cursor = 0;
  state.approvals = [];
  state.pinned = true;
  $("transcript").replaceChildren();
  $("approvals").replaceChildren();
  pollSession().catch(() => {});
  refreshSessions().catch(() => {});
}

// --- actions ---

$("composer").addEventListener("submit", async (event) => {
  event.preventDefault();
  const text = $("prompt").value.trim();
  if (!text || !state.sid) return;
  $("prompt").value = "";
  try {
    const result = await api(`/api/sessions/${state.sid}/prompt`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    flash(result.triggered ? "queued · runner starting…" : "queued");
  } catch (err) {
    flash(`error: ${err.message}`);
  }
});

$("prompt").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    $("composer").requestSubmit();
  }
});

$("btn-interrupt").addEventListener("click", async () => {
  try {
    await api(`/api/sessions/${state.sid}/interrupt`, { method: "POST" });
    flash("interrupt queued");
  } catch (err) {
    flash(`error: ${err.message}`);
  }
});

$("btn-kill").addEventListener("click", async () => {
  if (!confirm(`Kill ${state.sid}? The session terminates and cannot be resumed.`)) return;
  try {
    await api(`/api/sessions/${state.sid}/kill`, { method: "POST" });
    flash("killed");
    pollSession().catch(() => {});
  } catch (err) {
    flash(`error: ${err.message}`);
  }
});

// --- loops ---

setInterval(() => {
  if (!document.hidden) pollSession().catch(() => {});
}, 1000);
setInterval(() => {
  if (!document.hidden) refreshSessions().catch(() => {});
}, 4000);
setInterval(tickCountdowns, 500);

$("project").textContent = location.host;
refreshSessions().catch(() => {});
if (location.hash.startsWith("#sess_")) selectSession(location.hash.slice(1));
</script>
</body>
</html>
