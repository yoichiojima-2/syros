[project]
name = "syros"
version = "0.1.0"
description = "Run claude-agent-sdk agents in sandboxed Cloud Run Jobs on your own GCP project, with audited, approvable tool calls"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "claude-agent-sdk>=0.2",
    "google-cloud-bigquery>=3.25",
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "google-cloud-run>=0.10",
    "google-cloud-secret-manager>=2.20",
    "google-auth-oauthlib>=1.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff==0.15.8",
]

[project.scripts]
syros = "syros.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syros"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
